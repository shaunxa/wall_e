<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Pybricks Remote connected manual control screen">
  <rect width="390" height="844" fill="#f5f5fa"/>
  <rect x="0" y="0" width="390" height="62" fill="#ffffff"/>
  <text x="18" y="39" font-family="-apple-system,Arial" font-size="18" font-weight="700" fill="#15151b">Pybricks Remote</text>
  <circle cx="238" cy="33" r="5" fill="#25a649"/><text x="249" y="39" font-family="-apple-system,Arial" font-size="14" font-weight="600" fill="#25a649">Connected</text>
  <text x="344" y="39" text-anchor="middle" font-family="-apple-system,Arial" font-size="15" font-weight="600" fill="#0879ee">Disconnect</text>
  <text x="195" y="94" text-anchor="middle" font-family="-apple-system,Arial" font-size="15" fill="#72727d">Connected to Pybricks Hub</text>
  <text x="26" y="132" font-family="-apple-system,Arial" font-size="15" font-weight="600" fill="#15151b">⌁  Face control</text>
  <rect x="307" y="112" width="51" height="31" rx="16" fill="#d9d9e0"/><circle cx="323" cy="127.5" r="12" fill="#ffffff"/>
  <rect x="80" y="166" width="70" height="56" rx="13" fill="#0879ee"/><rect x="160" y="166" width="70" height="56" rx="13" fill="#df4048"/><rect x="240" y="166" width="70" height="56" rx="13" fill="#0879ee"/>
  <text x="115" y="190" text-anchor="middle" font-family="-apple-system,Arial" font-size="22" fill="#ffffff">↑</text><text x="115" y="211" text-anchor="middle" font-family="-apple-system,Arial" font-size="11" font-weight="600" fill="#ffffff">Forward</text>
  <text x="195" y="190" text-anchor="middle" font-family="-apple-system,Arial" font-size="18" fill="#ffffff">■</text><text x="195" y="211" text-anchor="middle" font-family="-apple-system,Arial" font-size="11" font-weight="600" fill="#ffffff">Stop</text>
  <text x="275" y="190" text-anchor="middle" font-family="-apple-system,Arial" font-size="22" fill="#ffffff">↓</text><text x="275" y="211" text-anchor="middle" font-family="-apple-system,Arial" font-size="11" font-weight="600" fill="#ffffff">Reverse</text>
  <text x="18" y="318" font-family="-apple-system,Arial" font-size="11" font-weight="700" letter-spacing="1" fill="#72727d">COMMAND LOG</text>
  <rect x="16" y="331" width="358" height="420" rx="14" fill="#e6e6ed"/>
  <text x="33" y="365" font-family="Menlo,monospace" font-size="14" fill="#15151b">→ fwd</text>
  <text x="33" y="394" font-family="Menlo,monospace" font-size="14" fill="#16893b">← ack:fwd</text>
  <text x="33" y="423" font-family="Menlo,monospace" font-size="14" fill="#15151b">→ stp</text>
  <text x="33" y="452" font-family="Menlo,monospace" font-size="14" fill="#16893b">← ack:stp</text>
  <rect x="135" y="814" width="120" height="5" rx="3" fill="#15151b"/>
</svg>
